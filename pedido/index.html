<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Namoro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="proposal-container">
        <div id="question-container">
            <h1 class="title">Quer namorar comigo?</h1>
            <div class="buttons-container">
                <button id="yes-button" class="button yes-button">Sim</button>
                <button id="no-button" class="button no-button">Não</button>
            </div>
        </div>
        
        <div id="answer-container" class="hidden">
            <h1 class="title">Eu sabia que você diria sim! ❤️</h1>
            <p class="subtitle">Você me faz a pessoa mais feliz do mundo!</p>
            <div class="heart-icon">❤️</div>
        </div>
        
        <div id="hearts-container"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
